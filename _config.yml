# إعدادُ Jekyll — غايتُه واحدةٌ: منعُ نشرِ أدواتِ العملِ على الموقع.
# ══════════════════════════════════════════════════════════════════
# 🔴 العلّةُ المقيسةُ 6 تشرين الأوّل 2026: قِيسَ الموقعُ الحيُّ فإذا
#    «ابن_البيئة_للنشر.py» و«حارس_النشر.py» و«كيف_ينشر_الموقع.md»
#    تُفتَحُ برمزِ 200 لأيِّ زائر. وفيها مسارُ قرصِ فاضل، وقائمةُ
#    كلِّ ما نحجبُه ولماذا، ودليلُ النشرِ كاملا.
#    وحارسُ النشرِ أعمى عنها: يفحصُ html/json/md/js ⛔ لا py.
#
# ⚖ ولماذا «exclude» لا نقلُ الملفّاتِ إلى مجلّدٍ بادئتُه «_» :
#    المسارُ داخلَ كلِّ أداةٍ مبنيٌّ على موضعِها من الجذر، فنقلُها
#    يكسرُ البناءَ والحرّاسَ. و«exclude» يُبقي كلَّ شيءٍ مكانَه.
#
# ⚠ وتحديدُ «exclude» يُلغي قائمةَ Jekyll الافتراضيّةَ ⟹ فهي مُعادةٌ
#    هنا بتمامِها قبلَ ما أُضيف.

exclude:
  # ── قائمةُ Jekyll الافتراضيّةُ (تُعادُ وإلّا سقطت) ──
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

  # ── ما لا يُنشَر ──
  # (وادواتُ العملِ غيرُ متتبَّعةٍ ⟹ فلا يراها Jekyll اصلا ⟹ فلا تُسمّى هنا)
  - "*.py"
  - "_*"
  - scripts/
  - __pycache__/
  - .gitignore
